dataset:
  asr_task_config:
    batch_shuffle_window: 1
    example_shuffle_window: 5000
    max_audio_len: 480000
    max_num_elements: 640000
    min_audio_len: 10000
    normalize_audio: true
  mixture_parquet_storage_config:
    beta_corpus: 0.5
    beta_language: 0.5
    dataset_summary_path: /local/scratch/matuor/data/parquet-data/language_distribution_0.tsv
    fragment_loading:
      cache: true
  name: romansh_dataset
  storage_mode: MIXTURE_PARQUET
  task_mode: ASR
  train_split: train
  valid_split: dev
model:
  name: omniASR_CTC_1B
optimizer:
  config:
    lr: 1e-05
regime:
  checkpoint_after_n_steps: 500
  checkpoint_every_n_steps: 500
  num_steps: 5000
  publish_metrics_after_n_steps: 500
  publish_metrics_every_n_steps: 500
  validate_after_n_steps: 500
  validate_every_n_steps: 500
tokenizer:
  name: omniASR_tokenizer_v1
trainer:
  freeze_encoder_for_n_steps: 0
  grad_accumulation:
    num_batches: 4
  mixed_precision:
    dtype: torch.bfloat16
